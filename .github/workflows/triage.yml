name: StoreKit Issue Triage

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to triage'
        required: true
        type: string

permissions: read-all

jobs:
  triage:
    name: Two-Tier StoreKit Triage
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: write
      # Required by the "Dispatch resolve workflow" step below, which calls the
      # workflow-dispatch API. Without it that call 403s.
      actions: write

    # Run if triggered manually, or if issue mentions storekit, or has relevant labels
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'p: in_app_purchase') ||
      contains(github.event.issue.labels.*.name, 'team-ios') ||
      contains(github.event.issue.labels.*.name, 'storekit-triage') ||
      contains(github.event.issue.title, 'storekit') ||
      contains(github.event.issue.title, 'StoreKit') ||
      contains(github.event.issue.title, 'in_app_purchase_storekit')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - id: auth
        name: Authenticate to Google Cloud (WIF)
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        if: env.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA }}
          token_format: access_token

      - id: run_triage
        name: Run Pure Dart Triage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_LOCATION: ${{ vars.GCP_LOCATION }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        # `run.dart --triage-only` rather than `triage.dart` directly. Both used
        # to have their own `main()`, and only `run.dart` had the model failover
        # loop, so a throttled model aborted triage here while the same issue
        # would have been triaged fine locally. Running the shared entrypoint
        # means this job and the resolve job agree on model selection, retry
        # behaviour, and the accepted/error distinction below.
        #
        # No `dart pub get`: nothing in the import graph uses `package:` imports,
        # which is exactly how agent_resolve.yml already invokes this script.
        run: |
          dart packages/in_app_purchase/in_app_purchase_storekit/.agents/tool/run.dart \
            --triage-only \
            --issue="$ISSUE_NUMBER"

      - name: Apply Acceptance Label & Comment
        if: steps.run_triage.outputs.accepted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          SCORE: ${{ steps.run_triage.outputs.score }}
          CATEGORY: ${{ steps.run_triage.outputs.category }}
          REASONING: ${{ steps.run_triage.outputs.reasoning }}
        run: |
          gh label create "ai-accepted" --description "Accepted by AI triage for autonomous resolution" --color "0E8A16" --force || true
          gh issue edit "$ISSUE_NUMBER" --add-label "ai-accepted"
          gh issue comment "$ISSUE_NUMBER" --body "### 🤖 StoreKit Autonomous Triage Verdict: ACCEPTED
          * **Suitability Score**: \`${SCORE}/10\`
          * **Category**: \`${CATEGORY}\`
          * **Reasoning**: ${REASONING}

          *This issue has been queued for autonomous SWE-bench verification and Draft PR generation.*"

      # The `ai-accepted` label above is the human-visible record, but it cannot
      # be what starts the resolve run. GitHub deliberately refuses to trigger a
      # workflow from an event that a `GITHUB_TOKEN` caused, to stop workflows
      # recursing into each other -- so `agent_resolve.yml`'s `issues: [labeled]`
      # trigger stays inert when the label is applied by the step above. That is
      # why the label previously had to be removed and re-added by hand.
      #
      # `workflow_dispatch` is the one documented exception: per GitHub's docs,
      # "workflow_dispatch and repository_dispatch events always create workflow
      # runs", even from `GITHUB_TOKEN`. So we dispatch explicitly. No PAT needed.
      #
      # The `issues: [labeled]` trigger on agent_resolve.yml is still worth
      # keeping: it is how a human re-runs the resolver by hand.
      - name: Dispatch resolve workflow
        if: steps.run_triage.outputs.accepted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          gh workflow run agent_resolve.yml -f issue_number="$ISSUE_NUMBER"
